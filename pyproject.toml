[project]
name = "openebm"
version = "0.1.0"
description = "Energy-Based language Models for non-autoregressive generation and reasoning."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "OpenEBM contributors" },
]
keywords = [
    "energy-based-models",
    "non-autoregressive",
    "language-models",
    "transformer",
    "ebt",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "datasets>=4.0.0",
    "fastapi>=0.117.1",
    "ipykernel>=7.1.0",
    "kernels>=0.11.7",
    "matplotlib>=3.10.8",
    "psutil>=7.1.0",
    "python-dotenv>=1.2.1",
    "regex>=2025.9.1",
    "rustbpe>=0.1.0",
    "scipy>=1.15.3",
    "setuptools>=80.9.0",
    "tabulate>=0.9.0",
    "tiktoken>=0.11.0",
    "tokenizers>=0.22.0",
    "torch==2.9.1",
    "transformers>=4.57.3",
    "uvicorn>=0.36.0",
    "wandb>=0.21.3",
    "zstandard>=0.25.0",
]

[project.urls]
Homepage = "https://github.com/openway-ai/OpenEBM"
Repository = "https://github.com/openway-ai/OpenEBM"
Issues = "https://github.com/openway-ai/OpenEBM/issues"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
testpaths = ["nanochat/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

# target torch to cuda 12.8 or CPU
[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[project.optional-dependencies]
cpu = [
    "torch==2.9.1",
]
gpu = [
    "torch==2.9.1",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "gpu" },
    ],
]

[tool.setuptools.packages.find]
where = [".", "nanochat"]

# ---------------------------------------------------------------------------
# Linting / formatting / type-checking
# ---------------------------------------------------------------------------
# The configuration below is scoped to the `openebm/elm` sub-package; the
# vendored `nanochat/` directory and other sub-packages are explicitly
# excluded so that their style is never rewritten or type-checked by OpenEBM
# tooling.

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["openebm/elm/**/*.py"]
extend-exclude = [
    "nanochat",
    "openebm/common",
    "openebm/dlm",
    "openebm/elm/bkp",
    "openebm/elm/sudoku_third_party",
    "openebm/elm/runs",
    "openebm/elm/lightning_logs",
    "openebm/elm/logs",
    "openebm/elm/tmp",
    "openebm/elm/tmp_docs",
    "lightning_logs",
    "logs",
    "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line length handled by formatter
    "E402",  # module-level imports-not-at-top are common in research notebooks
    "F401",  # keep re-exports from __init__.py
    "F403",  # wildcard imports are used by utils re-exports
    "F405",  # wildcard import star symbols
]

[tool.mypy]
python_version = "3.10"
files = ["openebm/elm"]
exclude = [
    "nanochat/",
    "openebm/common/",
    "openebm/dlm/",
    "openebm/elm/bkp/",
    "openebm/elm/sudoku_third_party/",
    "openebm/elm/runs/",
    "openebm/elm/lightning_logs/",
    "openebm/elm/logs/",
    "openebm/elm/tmp/",
    "openebm/elm/tmp_docs/",
    "lightning_logs/",
    "logs/",
    "tmp/",
]
ignore_missing_imports = true
follow_imports = "silent"
disallow_untyped_defs = false
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = false
show_error_codes = true
